name: StickyNotes
options:
  minimumXcodeGenVersion: "2.38.0"
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "10200"
    # Local builds sign ad-hoc. Pass CODESIGN_IDENTITY to build-app.sh (or set
    # CODE_SIGN_IDENTITY in Xcode) for a Developer ID / notarizable build.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    DEAD_CODE_STRIPPING: YES
targets:
  StickyNotes:
    type: application
    platform: macOS
    sources:
      - path: Sources/StickyNotes
        excludes:
          - "Resources/**"
      # Folder reference: copied verbatim to Contents/Resources/Editor/
      - path: Sources/StickyNotes/Resources/Editor
        type: folder
        buildPhase: resources
      - path: Sources/StickyNotes/Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Sources/StickyNotes/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.mdstickynotes
        PRODUCT_NAME: StickyNotes
        COMBINE_HIDPI_IMAGES: YES
    preBuildScripts:
      - name: Build editor bundle
        script: |
          "$SRCROOT/Scripts/build-editor.sh"
        basedOnDependencyAnalysis: false
        showEnvVars: false
schemes:
  StickyNotes:
    build:
      targets:
        StickyNotes: all
    run:
      config: Debug
    archive:
      config: Release
